split_clients "$http_x_forwarded_for|$http_user_agent" $toss_picker_index {
    25% 0;
    25% 1;
    25% 2;
    * 3;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location = /index.html {
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        sub_filter '__DEFAULT_PICKER_INDEX__' '$toss_picker_index';
        sub_filter_once off;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        sub_filter '__DEFAULT_PICKER_INDEX__' '$toss_picker_index';
        sub_filter_once off;
        try_files $uri /index.html;
    }
}
