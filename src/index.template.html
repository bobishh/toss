<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f0e8">
  <meta name="description" content="Pick random items from one or more lists. Save them here or share a link.">
  <title>Toss — pick from your lists</title>
  <style>
    :root {
      --paper: #f3f0e8;
      --ink: #171717;
      --muted: #6b675f;
      --line: #171717;
      --yellow: #ffd43b;
      --blue: #1f6feb;
      --red: #ff5a36;
      --panel: #fffdf7;
      --shadow: 6px 6px 0 #171717;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
      font-synthesis: none;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; min-height: 100%; overflow-x: hidden; }
    body { margin: 0; min-height: 100%; overflow-x: hidden; background: var(--paper); }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .48; }
    input, select { min-width: 0; }
    input:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
    input[aria-invalid="true"] { border-color: #b42318; background: #fff1ef; }

    .app-shell { min-height: 100vh; display: flex; flex-direction: column; }
    .topbar { height: 76px; padding: 0 clamp(18px, 4vw, 56px); border-bottom: 2px solid var(--line); display: flex; align-items: center; justify-content: space-between; background: rgba(243,240,232,.95); position: sticky; top: 0; z-index: 20; }
    .wordmark { border: 0; background: transparent; padding: 0; display: flex; align-items: center; gap: 10px; font-size: clamp(1rem, 4vw, 2rem); font-weight: 950; letter-spacing: -.06em; white-space: nowrap; }
    .wordmark-dot { width: 18px; height: 18px; border-radius: 50%; background: var(--red); border: 2px solid var(--ink); }
    .mode-indicator { display: flex; align-items: center; gap: 10px; font: 800 .76rem/1 ui-monospace, monospace; letter-spacing: .12em; }
    .mode-number { display: grid; place-items: center; width: 34px; height: 34px; color: white; background: var(--ink); border-radius: 50%; letter-spacing: 0; }

    .builder, .runner { flex: 1; width: min(1480px, 100%); margin: 0 auto; padding: clamp(26px, 5vw, 72px) clamp(16px, 4vw, 56px) 110px; }
    .builder-intro { max-width: 760px; }
    .eyebrow { font: 800 .72rem/1.2 ui-monospace, monospace; letter-spacing: .15em; text-transform: uppercase; margin-bottom: 14px; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 16px; font-size: clamp(2.8rem, 9vw, 6.8rem); line-height: .86; letter-spacing: -.075em; font-weight: 950; }
    .lede { max-width: 680px; color: var(--muted); font-size: clamp(1rem, 2vw, 1.25rem); line-height: 1.5; }
    .agent-lede-link { color: var(--ink); font-style: italic; text-decoration-thickness: 2px; text-underline-offset: 3px; }
    .agent-lede-link:hover { color: var(--blue); }

    .local-shelf { margin: 38px 0 22px; padding: 12px; display: grid; grid-template-columns: auto minmax(160px, 320px) auto; gap: 12px; align-items: center; border: 2px solid var(--line); background: var(--panel); }
    .local-shelf > label { font: 800 .7rem/1 ui-monospace, monospace; letter-spacing: .12em; }
    select, input:not([type="color"]) { min-height: 46px; border: 2px solid var(--line); border-radius: 0; padding: 10px 12px; background: white; }
    fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
    fieldset > label, .control-label { display: block; margin-bottom: 7px; font: 800 .68rem/1 ui-monospace, monospace; letter-spacing: .11em; text-transform: uppercase; }

    .banner { margin: 16px 0; padding: 16px 18px; border: 2px solid var(--line); font-size: .93rem; }
    .banner p { margin: 5px 0 0; }
    .banner--warning { background: var(--yellow); }
    .banner--error { background: #fff1ef; border-color: #b42318; color: #7a271a; }
    .banner-title { font-weight: 850; }

    .builder-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(300px, .65fr); gap: clamp(24px, 5vw, 72px); align-items: start; }
    .editor-column { min-width: 0; }
    .title-field { margin-bottom: 20px; }
    .title-field input { width: 100%; font-size: 1.25rem; font-weight: 800; }
    .groups { display: grid; gap: 22px; }
    .group-card { position: relative; border: 2px solid var(--line); background: var(--panel); box-shadow: var(--shadow); overflow: hidden; }
    .group-card__accent { height: 12px; border-bottom: 2px solid var(--line); }
    .group-card__header { padding: 16px; display: grid; grid-template-columns: 42px minmax(0, 1fr) 44px; gap: 12px; align-items: end; border-bottom: 1px solid #bbb6aa; }
    .group-index { width: 42px; height: 42px; display: grid; place-items: center; border: 2px solid var(--line); border-radius: 50%; font: 800 .78rem/1 ui-monospace, monospace; }
    .group-name-field input { width: 100%; font-weight: 800; }
    .icon-button { width: 44px; height: 44px; padding: 0; border: 2px solid var(--line); background: transparent; font-size: 1.5rem; line-height: 1; }
    .icon-button:hover { color: white; background: var(--red); }
    .icon-button--small { align-self: start; }
    .group-controls { padding: 14px 16px; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; background: #e9e5db; border-bottom: 1px solid #bbb6aa; }
    .pick-control { display: flex; align-items: center; gap: 10px; min-height: 44px; }
    .pick-control .control-label { margin: 0 4px 0 0; }
    .pick-control strong { min-width: 24px; text-align: center; font-size: 1.25rem; }
    .stepper { width: 40px; height: 40px; padding: 0; border: 2px solid var(--line); background: white; font-weight: 900; }
    .of-count { font: 750 .72rem/1 ui-monospace, monospace; color: var(--muted); }
    .color-controls { display: flex; gap: 12px; }
    .color-controls label { display: flex; align-items: center; gap: 7px; font: 800 .65rem/1 ui-monospace, monospace; }
    input[type="color"] { width: 44px; height: 44px; padding: 2px; border: 2px solid var(--line); border-radius: 50%; background: white; overflow: hidden; }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 50%; }
    .choice-list { padding: 16px; display: grid; gap: 12px; }
    .choice-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) 44px; gap: 10px; align-items: center; }
    .choice-number { font: 800 .72rem/1 ui-monospace, monospace; color: var(--muted); }
    .choice-fields { display: grid; grid-template-columns: minmax(120px, .8fr) minmax(160px, 1.2fr); gap: 8px; min-width: 0; }
    .choice-fields input { width: 100%; }
    .image-url { color: var(--muted); font-size: .86rem; }
    .button { min-height: 46px; border: 2px solid var(--line); padding: 10px 16px; background: white; font-weight: 800; }
    .button:hover { transform: translate(-2px, -2px); box-shadow: 3px 3px 0 var(--ink); }
    .button--primary { color: white; background: var(--ink); }
    .button--secondary { background: var(--panel); }
    .button--add { width: 100%; margin-top: 22px; border-style: dashed; background: transparent; }
    .button--choice { width: calc(100% - 32px); margin: 0 16px 16px; min-height: 42px; background: transparent; border-style: dashed; }
    .button--quiet { background: transparent; }

    .preview-column { min-width: 0; }
    .preview-sticky { position: sticky; top: 108px; padding: clamp(18px, 3vw, 30px); border: 2px solid var(--line); background: #dfeaff; }
    .preview-sticky h2 { font-size: clamp(1.8rem, 4vw, 3.4rem); line-height: .95; letter-spacing: -.05em; }
    .preview-stack { display: grid; gap: 4px; margin: 30px 0; }
    .preview-group { min-height: 124px; padding: 18px; border: 2px solid var(--line); box-shadow: 4px 4px 0 rgba(23,23,23,.88); }
    .preview-group__top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .preview-group__top strong { font-size: 1.3rem; }
    .preview-group__top span { font: 800 .72rem/1 ui-monospace, monospace; }
    .preview-options { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 20px; }
    .preview-options span { padding: 5px 8px; border: 1px solid currentColor; font-size: .75rem; }
    .preview-total { padding-top: 18px; border-top: 2px solid var(--line); display: flex; justify-content: space-between; font: 800 .75rem/1 ui-monospace, monospace; letter-spacing: .08em; }
    .preview-total strong { font-size: 1rem; }

    .builder-actions { position: sticky; bottom: 0; z-index: 15; margin-top: 34px; padding: 12px; border: 2px solid var(--line); background: rgba(243,240,232,.96); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .total-pill { min-height: 46px; display: flex; align-items: center; padding: 0 16px; color: white; background: var(--blue); font-weight: 900; }
    .action-cluster { display: flex; gap: 10px; }
    .notice { width: fit-content; margin: 16px 0 0 auto; padding: 10px 14px; color: white; background: var(--ink); font: 750 .78rem/1.3 ui-monospace, monospace; }

    .runner { display: grid; gap: 28px; }
    .runner-heading { position: relative; text-align: center; padding-top: 28px; }
    .runner-heading h1 { max-width: 900px; margin-left: auto; margin-right: auto; }
    .runner-heading p { color: var(--muted); }
    .back-button { position: absolute; left: 0; top: 0; min-height: 44px; border: 0; background: transparent; font-weight: 850; }
    .run-surface { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 18px; align-items: stretch; }
    .run-group { position: relative; min-width: 0; min-height: 310px; padding: clamp(18px, 4vw, 30px); border: 3px solid var(--line); box-shadow: 8px 8px 0 var(--ink); overflow: hidden; }
    .run-group__heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding-bottom: 18px; border-bottom: 2px solid currentColor; }
    .run-group__heading > div { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .run-group__heading h2 { margin: 0; overflow-wrap: anywhere; font-size: clamp(1.6rem, 5vw, 2.8rem); line-height: .9; letter-spacing: -.05em; }
    .run-group__index, .run-group__quota { font: 850 .7rem/1 ui-monospace, monospace; letter-spacing: .08em; }
    .run-group__quota { flex: none; padding: 7px 9px; border: 2px solid currentColor; }
    .waiting-options { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; padding-top: 24px; opacity: .72; }
    .waiting-options span { padding: 8px 10px; border: 1px solid currentColor; font-size: .82rem; }
    .result-grid { padding-top: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
    .result-card { min-height: 138px; padding: 14px; display: flex; flex-direction: column; justify-content: flex-end; border: 2px solid currentColor; background: rgba(255,255,255,.2); animation: land .48s cubic-bezier(.17,.67,.24,1.25) both; }
    .result-card:nth-child(2) { animation-delay: .08s; transform: rotate(1.5deg); }
    .result-card:nth-child(3) { animation-delay: .16s; transform: rotate(-1deg); }
    .result-card img { width: 100%; height: 100px; margin-bottom: 12px; object-fit: cover; border: 1px solid currentColor; }
    .result-card strong { font-size: 1.25rem; line-height: 1.05; overflow-wrap: anywhere; }
    .throw-zone { min-height: 190px; display: grid; place-items: center; position: relative; }
    .throw-card { grid-area: 1 / 1; width: 110px; height: 145px; display: grid; place-items: center; border: 3px solid currentColor; background: rgba(255,255,255,.45); font: 950 3rem/1 ui-monospace, monospace; animation: throw .7s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--throw-index) * 60ms); }
    .run-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
    .toss-button { min-width: min(100%, 330px); min-height: 86px; padding: 14px 22px; border: 3px solid var(--line); color: var(--ink); background: var(--yellow); box-shadow: 7px 7px 0 var(--ink); display: flex; align-items: center; justify-content: space-between; gap: 22px; font-weight: 900; }
    .toss-button__verb { font-size: 1.6rem; letter-spacing: -.04em; }
    .toss-button:hover:not(:disabled) { transform: translate(-3px, -3px); box-shadow: 10px 10px 0 var(--ink); }

    .site-footer { min-height: 152px; padding: 24px clamp(16px, 4vw, 56px); border-top: 2px solid var(--line); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; color: var(--ink); text-align: center; font: 700 .7rem/1.4 ui-monospace, monospace; }
    .tower-mark { width: 36px; height: 54px; overflow: visible; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: square; stroke-linejoin: miter; }
    .tower-mark__sphere { fill: var(--red); }
    .footer-copy { font-size: .78rem; }

    .agent-page[hidden] { display: none; }
    .agent-page { min-height: 100vh; background: var(--paper); }
    .agent-topbar { min-height: 76px; padding: 0 clamp(18px, 4vw, 56px); border-bottom: 2px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .agent-home { color: var(--ink); font-weight: 950; text-decoration: none; letter-spacing: -.04em; }
    .agent-route { font: 800 .72rem/1 ui-monospace, monospace; letter-spacing: .12em; }
    .agent-main { width: min(1040px, 100%); margin: 0 auto; padding: clamp(36px, 7vw, 88px) clamp(16px, 4vw, 56px) 96px; }
    .agent-intro { max-width: 800px; margin-bottom: 34px; }
    .agent-intro h1 { font-size: clamp(3.1rem, 9vw, 7rem); }
    .agent-intro p { max-width: 660px; color: var(--muted); font-size: clamp(1rem, 2vw, 1.25rem); line-height: 1.5; }
    .agent-prompt-shell { border: 2px solid var(--line); background: var(--panel); box-shadow: 8px 8px 0 var(--ink); }
    .agent-prompt-actions { position: sticky; top: 0; z-index: 2; padding: 12px; border-bottom: 2px solid var(--line); background: var(--yellow); display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .agent-copy-status { min-height: 1em; font: 800 .72rem/1.3 ui-monospace, monospace; }
    .agent-prompt { min-height: 560px; max-height: 72vh; margin: 0; padding: clamp(18px, 4vw, 34px); overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font: 650 .78rem/1.65 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    @keyframes throw {
      0% { transform: translateY(-170px) translateX(90px) rotate(140deg) scale(.55); opacity: 0; }
      70% { opacity: 1; }
      100% { transform: translateY(calc((var(--throw-index) - 2) * 7px)) translateX(calc((var(--throw-index) - 2) * 20px)) rotate(calc((var(--throw-index) - 2) * 7deg)) scale(1); opacity: 1; }
    }
    @keyframes land {
      from { transform: translateY(-80px) rotate(8deg) scale(.75); opacity: 0; }
      to { transform: translateY(0) rotate(0) scale(1); opacity: 1; }
    }

    @media (max-width: 860px) {
      .builder-grid { grid-template-columns: 1fr; }
      .preview-column { order: -1; }
      .preview-sticky { position: static; }
      .preview-stack { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
      .preview-group { min-height: 105px; }
    }

    @media (max-width: 620px) {
      .topbar { height: 64px; }
      .builder, .runner { padding-top: 30px; }
      .local-shelf { grid-template-columns: 1fr auto; }
      .local-shelf > label { grid-column: 1 / -1; }
      .group-card { box-shadow: 4px 4px 0 var(--ink); }
      .group-card__header { grid-template-columns: 34px minmax(0, 1fr) 44px; padding: 12px; gap: 8px; }
      .group-index { width: 34px; height: 34px; }
      .group-controls { align-items: stretch; }
      .pick-control, .color-controls { justify-content: space-between; }
      .choice-list { padding: 12px; }
      .choice-row { grid-template-columns: 22px minmax(0, 1fr) 44px; gap: 7px; }
      .choice-fields { grid-template-columns: 1fr; }
      .builder-actions { margin-left: -16px; margin-right: -16px; padding-left: 16px; padding-right: 16px; }
      .action-cluster { flex: 1; }
      .action-cluster .button { flex: 1; padding-left: 9px; padding-right: 9px; }
      .total-pill { padding: 0 10px; }
      .run-group { min-height: 260px; box-shadow: 5px 5px 0 var(--ink); }
      .site-footer { align-items: center; }
      .agent-topbar { min-height: 64px; }
      .agent-prompt-actions { align-items: stretch; flex-direction: column; }
      .agent-prompt-actions .button { width: 100%; }
      .agent-copy-status { text-align: center; }
      .agent-prompt { max-height: none; }
    }

    @media (max-width: 390px) {
      .mode-indicator > span:last-child { display: none; }
      .builder-actions { align-items: stretch; flex-direction: column; }
      .total-pill { justify-content: center; }
      .group-controls { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <section id="agent-page" class="agent-page" hidden>
    <header class="agent-topbar">
      <a class="agent-home" href="/">← TOSS</a>
      <span class="agent-route">/AGENT</span>
    </header>
    <main class="agent-main">
      <section class="agent-intro">
        <div class="eyebrow">COPY. PASTE. GET A LINK.</div>
        <h1>Make Toss links</h1>
        <p>Give this prompt to an agent. It can encode a complete Toss directly into a shareable URL. No API or account needed.</p>
      </section>
      <section class="agent-prompt-shell" aria-label="Agent prompt">
        <div class="agent-prompt-actions">
          <button id="copy-agent-prompt" class="button button--primary" type="button">Copy prompt</button>
          <span id="agent-copy-status" class="agent-copy-status" role="status" aria-live="polite"></span>
        </div>
        <pre id="agent-prompt" class="agent-prompt" data-testid="agent-prompt" tabindex="0"></pre>
      </section>
    </main>
  </section>
  <div id="app"></div>
  <script>/*__ELM_BUNDLE__*/</script>
  <script id="agent-prompt-source" type="text/plain">
You create shareable Toss links. Toss is a static picker at https://toss.quitter.live/. It has no API, upload, account, or server-side state. Encode the complete picker into the URL fragment.

Return:
https://toss.quitter.live/#PAYLOAD

For a reproducible result, append a positive base-36 seed:
https://toss.quitter.live/#PAYLOAD~SEED

Input model:
{
  title: string,
  groups: [{
    name: string,
    background: "#rrggbb",
    foreground: "#rrggbb",
    pickCount: integer,
    options: [{ label: string, imageUrl: string }]
  }]
}

Rules:
- Require at least one group and one option per group.
- Require 1 <= pickCount <= options.length.
- Empty imageUrl is valid.
- If the user omits a title, use "Toss".
- If the user omits pickCount, use 1.
- If colors are omitted, cycle backgrounds #ffd43b, #ff6b35, #69db7c, #74c0fc and use #171717 foreground.
- Preserve Unicode by encoding strings as UTF-8.
- The payload uses Base64URL without padding, not JSON Base64.
- Do not invent a result seed unless the user asks for a fixed result.
- Return the URL plus a compact summary. Do not dump codec internals unless asked.

Binary codec v1, in order:
1. Byte 1: codec version.
2. String: picker title.
3. Byte 0: Toss mechanic.
4. Varuint: group count.
5. For each group:
   a. String: group name.
   b. 3 bytes: background RGB.
   c. 3 bytes: foreground RGB.
   d. Varuint: pickCount.
   e. Varuint: option count.
   f. For each option: label string, then imageUrl string.

A string is its UTF-8 byte length as a varuint, followed by those bytes.
A varuint writes seven low bits per byte, least-significant group first. Set bit 7 when another byte follows.

Reference JavaScript:

function encodePicker(picker) {
  const encoder = new TextEncoder();
  const bytes = [];
  const byte = value => bytes.push(value & 255);
  const varuint = value => {
    let current = Math.max(0, Math.floor(value));
    do {
      let next = current & 127;
      current = Math.floor(current / 128);
      if (current > 0) next |= 128;
      byte(next);
    } while (current > 0);
  };
  const string = value => {
    const encoded = encoder.encode(String(value));
    varuint(encoded.length);
    for (const value of encoded) byte(value);
  };
  const color = value => {
    const match = /^#([0-9a-f]{6})$/i.exec(value);
    if (!match) throw new Error(`Invalid color: ${value}`);
    byte(parseInt(match[1].slice(0, 2), 16));
    byte(parseInt(match[1].slice(2, 4), 16));
    byte(parseInt(match[1].slice(4, 6), 16));
  };

  if (!picker.groups?.length) throw new Error("At least one group is required");
  byte(1);
  string(picker.title || "Toss");
  byte(0);
  varuint(picker.groups.length);

  for (const group of picker.groups) {
    if (!group.options?.length) throw new Error("Every group needs an option");
    if (!Number.isInteger(group.pickCount) || group.pickCount < 1 || group.pickCount > group.options.length) {
      throw new Error("pickCount must fit the option count");
    }
    string(group.name);
    color(group.background);
    color(group.foreground);
    varuint(group.pickCount);
    varuint(group.options.length);
    for (const option of group.options) {
      string(option.label);
      string(option.imageUrl || "");
    }
  }

  let base64;
  if (typeof Buffer !== "undefined") {
    base64 = Buffer.from(bytes).toString("base64");
  } else {
    let binary = "";
    for (const value of bytes) binary += String.fromCharCode(value);
    base64 = btoa(binary);
  }
  return base64.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
}

function makeTossUrl(picker, seed = null) {
  const payload = encodePicker(picker);
  if (seed == null) return `https://toss.quitter.live/#${payload}`;
  if (!Number.isSafeInteger(seed) || seed < 1 || seed > 0x7fffffff) throw new Error("Invalid seed");
  return `https://toss.quitter.live/#${payload}~${seed.toString(36)}`;
}
  </script>
  <script>
    (() => {
      const agentRoute = location.pathname.replace(/\/+$/, '') === '/agent' || new URLSearchParams(location.search).has('agent');
      if (agentRoute) {
        const appNode = document.getElementById('app');
        const agentPage = document.getElementById('agent-page');
        const prompt = document.getElementById('agent-prompt-source').textContent.trim();
        const promptNode = document.getElementById('agent-prompt');
        const statusNode = document.getElementById('agent-copy-status');
        document.title = 'Toss — agent prompt';
        appNode.hidden = true;
        agentPage.hidden = false;
        promptNode.textContent = prompt;
        document.getElementById('copy-agent-prompt').addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(prompt);
            statusNode.textContent = 'Copied.';
          } catch (_) {
            statusNode.textContent = 'Copy failed. Select the prompt and copy it manually.';
          }
        });
        return;
      }

      const STORAGE_KEY = 'toss:pickers:v1';
      const encoder = new TextEncoder();
      const decoder = new TextDecoder('utf-8', { fatal: true });

      class Writer {
        constructor() { this.bytes = []; }
        byte(value) { this.bytes.push(value & 255); }
        varuint(value) {
          let current = Math.max(0, Math.floor(value));
          do {
            let next = current & 127;
            current = Math.floor(current / 128);
            if (current > 0) next |= 128;
            this.byte(next);
          } while (current > 0);
        }
        string(value) {
          const bytes = encoder.encode(String(value));
          this.varuint(bytes.length);
          for (const byte of bytes) this.byte(byte);
        }
        color(value) {
          const match = /^#([0-9a-f]{6})$/i.exec(value);
          const hex = match ? match[1] : '171717';
          this.byte(parseInt(hex.slice(0, 2), 16));
          this.byte(parseInt(hex.slice(2, 4), 16));
          this.byte(parseInt(hex.slice(4, 6), 16));
        }
      }

      class Reader {
        constructor(bytes) { this.bytes = bytes; this.offset = 0; }
        byte() {
          if (this.offset >= this.bytes.length) throw new Error('Unexpected end of payload');
          return this.bytes[this.offset++];
        }
        varuint() {
          let value = 0;
          let factor = 1;
          for (let index = 0; index < 5; index += 1) {
            const byte = this.byte();
            value += (byte & 127) * factor;
            if ((byte & 128) === 0) return value;
            factor *= 128;
          }
          throw new Error('Invalid integer');
        }
        string() {
          const length = this.varuint();
          if (length > 65535 || this.offset + length > this.bytes.length) throw new Error('Invalid string');
          const value = decoder.decode(this.bytes.slice(this.offset, this.offset + length));
          this.offset += length;
          return value;
        }
        color() {
          return '#' + [this.byte(), this.byte(), this.byte()]
            .map(value => value.toString(16).padStart(2, '0'))
            .join('');
        }
      }

      function toBase64Url(bytes) {
        let binary = '';
        for (const byte of bytes) binary += String.fromCharCode(byte);
        return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
      }

      function fromBase64Url(value) {
        if (!/^[A-Za-z0-9_-]+$/.test(value)) throw new Error('Invalid Base64URL');
        const padded = value.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - value.length % 4) % 4);
        const binary = atob(padded);
        return Uint8Array.from(binary, character => character.charCodeAt(0));
      }

      function encodePicker(picker) {
        const writer = new Writer();
        writer.byte(1);
        writer.string(picker.title);
        writer.byte(0);
        writer.varuint(picker.groups.length);
        for (const group of picker.groups) {
          writer.string(group.name);
          writer.color(group.background);
          writer.color(group.foreground);
          writer.varuint(group.pickCount);
          writer.varuint(group.options.length);
          for (const option of group.options) {
            writer.string(option.label);
            writer.string(option.imageUrl);
          }
        }
        return toBase64Url(writer.bytes);
      }

      function decodePicker(payload) {
        const reader = new Reader(fromBase64Url(payload));
        if (reader.byte() !== 1) throw new Error('Unknown Toss version');
        const title = reader.string();
        if (reader.byte() !== 0) throw new Error('Unknown Toss mechanic');
        const groupCount = reader.varuint();
        if (groupCount < 1 || groupCount > 64) throw new Error('Invalid group count');
        const groups = [];
        for (let groupIndex = 0; groupIndex < groupCount; groupIndex += 1) {
          const name = reader.string();
          const background = reader.color();
          const foreground = reader.color();
          const pickCount = reader.varuint();
          const optionCount = reader.varuint();
          if (optionCount < 1 || optionCount > 1024 || pickCount < 1 || pickCount > optionCount) {
            throw new Error('Invalid group');
          }
          const options = [];
          for (let optionIndex = 0; optionIndex < optionCount; optionIndex += 1) {
            options.push({ label: reader.string(), imageUrl: reader.string() });
          }
          groups.push({ name, background, foreground, pickCount, options });
        }
        if (reader.offset !== reader.bytes.length) throw new Error('Trailing payload data');
        return { id: 0, title, groups };
      }

      function loadSaved() {
        try {
          const value = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
          return Array.isArray(value) ? value : [];
        } catch (_) {
          return [];
        }
      }

      function loadShared() {
        const raw = location.hash.slice(1);
        if (!raw) return { shared: null, seed: null, sharedError: null };
        try {
          const parts = raw.split('~');
          if (parts.length > 2 || !parts[0]) throw new Error('Invalid link');
          const shared = decodePicker(parts[0]);
          let seed = null;
          if (parts.length === 2) {
            if (!/^[0-9a-z]+$/i.test(parts[1])) throw new Error('Invalid result seed');
            seed = parseInt(parts[1], 36);
            if (!Number.isSafeInteger(seed) || seed < 1 || seed > 0x7fffffff) throw new Error('Invalid result seed');
          }
          return { shared, seed, sharedError: null };
        } catch (_) {
          return {
            shared: null,
            seed: null,
            sharedError: 'This link is damaged or from a newer version. Your saved tosses are untouched.',
          };
        }
      }

      const sharedFlags = loadShared();
      const app = Elm.Main.init({
        node: document.getElementById('app'),
        flags: { saved: loadSaved(), ...sharedFlags, year: new Date().getFullYear() },
      });

      app.ports.persist.subscribe(saved => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(saved)); } catch (_) {}
      });

      app.ports.setShare.subscribe(({ picker, seed }) => {
        const payload = encodePicker(picker);
        const result = seed == null ? payload : payload + '~' + seed.toString(36);
        history.replaceState(null, '', location.pathname + location.search + '#' + result);
      });

      app.ports.clearShare.subscribe(() => {
        history.replaceState(null, '', location.pathname + location.search);
      });

      app.ports.requestSeed.subscribe(() => {
        const values = new Uint32Array(1);
        crypto.getRandomValues(values);
        const seed = (values[0] & 0x7fffffff) || 1;
        app.ports.seedReceived.send(seed);
      });

      app.ports.copyLink.subscribe(async () => {
        let worked = false;
        try {
          await navigator.clipboard.writeText(location.href);
          worked = true;
        } catch (_) {
          const temporary = document.createElement('textarea');
          temporary.value = location.href;
          temporary.style.position = 'fixed';
          temporary.style.opacity = '0';
          document.body.appendChild(temporary);
          temporary.select();
          worked = document.execCommand('copy');
          temporary.remove();
        }
        app.ports.linkCopied.send(worked);
      });
    })();
  </script>
</body>
</html>
